kind = "web"
previewPath = "/"
title = "Growitate CRM Platform"
version = "1.0.0"
id = "artifacts/growitate-crm"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 25779
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/growitate-crm run dev"

[services.env]
PORT = "25779"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/growitate-crm", "run", "build"]
publicDir = "artifacts/growitate-crm/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
